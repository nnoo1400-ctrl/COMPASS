    <script async src="https://tally.so/widgets/embed.js"></script>
    
    <style>
        /* تصفير الهوامش لضمان أخذ النموذج لمساحة الشاشة الكاملة */
        html, body { 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%; 
            overflow: hidden; 
            background-color: #ffffff; /* خلفية بيضاء افتراضية */
        }
        /* ضبط إطار النموذج ليغطي الشاشة بالكامل بدون حواف */
        iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }
    </style>
</head>
<body>

    <!-- إطار نموذج Tally المتجاوب -->

        data-tally-src="https://tally.so/r/zx8xqq?transparentBackground=1"
